name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

  # Publish SNAPSHOT từ main và release từ tag v* lên GitHub Packages của repo này.
  # Không cần secret thủ công: GITHUB_TOKEN đủ quyền ghi package của chính repo.
  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven
          # setup-java ghi credential vào ~/.m2/settings.xml dưới id khai ở
          # <distributionManagement> của root pom.
          server-id: javalibs-snapshots
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Deploy artifacts
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -DskipTests deploy -Prelease
